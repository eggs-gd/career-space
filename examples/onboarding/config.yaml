# Candidate-specific positioning data. `shared:` only -- WHO/WHY (stable identity/direction) plus
# stable reference facts that are the same regardless of surface (contacts, contact_strategy,
# certifications, education, languages) -- concrete, not narrative, so they don't belong in
# CV_GENERAL.md's prose either. CV_GENERAL.md's own content (achievements, evidence) is never
# duplicated here. A public surface's own positioning intent lives in
# data/surfaces/<name>/context.md, not this file. Full model: policies/surfaces-framework.md and
# policies/generation-rules.md.
#
# Fictional example candidate (Alex Morgan) -- ordinary, competent, nothing distinctive on
# purpose. Shows the shape every field should have, not a positioning worth copying.

shared:
  full_name: "Alex Morgan"
  professional_identity:
    - Backend Developer
    - Software Engineer
  commercial_directions: []
  differentiators:
    - "Reliable delivery"
    - "Backend/API work"
    - "Comfortable in existing codebases"
  # Opens every surface's narrative section, close to verbatim.
  core_identity_line: >-
    Most of what I do is take a backend ticket from vague to shipped, without needing much
    hand-holding along the way.
  # Broader/aspirational titles explicitly rejected unless the positioning strategy changes.
  rejected_broader_titles:
    - Engineering Manager
  contacts:
    location: "Berlin, Germany"
    email: "alex.morgan@example.com"
    linkedin: "https://www.linkedin.com/in/alexmorgan-example"
    # No `phone` -- optional field, left out here to show that's a valid state, not something
    # every candidate has to fill in.
    # No `landing`/`portfolio` either, same reason.
  contact_strategy:
    targeted_cv:
      remote_or_nonlocal:
        location: "Remote"
        include_phone: false
      local:
        use_config_location: true
        include_phone: true
    links: {}
  certifications:
    - "AWS Certified Developer -- Associate, 2021"
  education:
    - "State University -- Computer Science, 2013 - 2017"
  languages:
    german: native
    english: professional
