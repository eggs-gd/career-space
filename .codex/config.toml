[mcp_servers.career-space]
command = "node"
args = ["scripts/mcp_bootstrap.js"]

[mcp_servers.career-space.tools.resolve_vacancy_url]
approval_mode = "approve"

[mcp_servers.career-space.tools.score_fit]
approval_mode = "approve"

[mcp_servers.career-space.tools.vacancy_set_archived]
approval_mode = "approve"

[mcp_servers.career-space.tools.vacancy_set_status]
approval_mode = "approve"

[mcp_servers.career-space.tools.vacancy_list]
approval_mode = "approve"

[mcp_servers.career-space.tools.record_scout_outcomes]
approval_mode = "approve"

[mcp_servers.career-space.tools.vacancy_resolve]
approval_mode = "approve"

[mcp_servers.career-space.tools.render_resume]
approval_mode = "approve"

[mcp_servers.career-space.tools.render_cover_letter]
approval_mode = "approve"

[mcp_servers.career-space.tools.render_board]
approval_mode = "approve"

[mcp_servers.career-space.tools.scout_fetch]
approval_mode = "approve"

[mcp_servers.design-patterns]
command = "sh"
args = ["-c", "AGENTS_TOOLS_DIR=\"${AGENTS_TOOLS_DIR:-$HOME/.agents}\"; exec env DATABASE_PATH=\"$AGENTS_TOOLS_DIR/design_patterns_mcp/data/design-patterns.db\" node \"$AGENTS_TOOLS_DIR/design_patterns_mcp/dist/mcp-server.js\""]

[mcp_servers.ts-language]
command = "npx"
args = ["-y", "ts-language-mcp", "."]
