# SonarQube analysis, run with `make sonar` on the maintainer's machine. The server's
# address and the token are not here: SONAR_HOST_URL and SONAR_TOKEN come from the
# environment or a git-ignored .env. See CONTRIBUTING.md.
sonar.projectKey=career-space
sonar.projectName=Career Space
sonar.sourceEncoding=UTF-8

# The engine (scripts/) and the site (site/src). Tests live next to the code, so they are kept out
# of the sources by exclusion and picked up again as tests. Compiled output, dependencies and the
# fixtures the tests read are not analysed. data/ is the candidate's own and never in the repository.
sonar.sources=scripts,site/src
sonar.tests=scripts
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,scripts/dist/**,scripts/fixtures/**,site/.svelte-kit/**,site/build/**,**/*.test.ts

# Written by `make sonar` (npm run coverage). The compiled tests carry source maps, so the paths
# in it are the .ts files.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Cognitive complexity is not a test's measure: a table of cases reads as one function.
sonar.issue.ignore.multicriteria=testComplexity
sonar.issue.ignore.multicriteria.testComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.testComplexity.resourceKey=**/*.test.ts
